<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your To Taste sign-in code</title>
</head>
<body style="margin:0;padding:32px 24px;background:#ffffff;color:#191a1c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <main style="max-width:440px;margin:0 auto">
    <p style="margin:0 0 24px;font-size:16px;font-weight:700">To Taste</p>
    <h1 style="margin:0 0 12px;font-size:26px">Your sign-in code</h1>
    <p style="margin:0 0 20px;line-height:1.5">Enter this one-time code in To Taste to continue.</p>
    <p style="margin:0 0 16px"><strong style="display:inline-block;background:#f2f3f5;border-radius:12px;padding:14px 20px;font-size:30px;letter-spacing:4px">{{ .Token }}</strong></p>
    <p style="margin:0 0 24px;line-height:1.5">On iPhone, touch and hold the code to copy it, then paste it into To Taste.</p>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#53565c">If you didn’t request this code, you can ignore this email.</p>
  </main>
</body>
</html>
